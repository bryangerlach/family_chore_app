{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade - Star Dash</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{% static 'chores/js/sound_effects.js' %}"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

    <div class="w-full max-w-2xl flex justify-between items-center bg-slate-800/80 border border-slate-700/60 p-4 rounded-2xl shadow-lg">
        <a href="{% url 'arcade_hub' profile.id %}" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-xl text-sm font-bold transition flex items-center gap-2">
            <span>←</span> Back to Arcade
        </a>
        <div class="flex items-center gap-4">
            <span class="bg-yellow-500/20 border border-yellow-500/40 text-yellow-300 px-3 py-1.5 rounded-xl font-bold text-sm">
                🪙 {{ coin_balance }} Coins
            </span>
            <span class="font-bold text-indigo-400">⭐ Star Dash</span>
        </div>
    </div>

    <div class="flex flex-col items-center my-auto w-full max-w-2xl">
        <div class="relative bg-slate-950 border-2 border-indigo-500/40 rounded-2xl overflow-hidden shadow-2xl w-full aspect-[2/1]">
            <canvas id="gameCanvas" class="w-full h-full block cursor-pointer"></canvas>
            
            <div id="gameOverlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center">
                <h1 class="text-3xl font-extrabold text-indigo-400 mb-2">⭐ Star Dash ⭐</h1>
                <p class="text-slate-300 text-sm mb-6 max-w-xs">Leap across reachable platforms, choose your path, and watch your character flip in the air!</p>
                <button onclick="startGame()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold px-8 py-3 rounded-2xl shadow-lg transition transform hover:scale-105">
                    Play Game 🚀
                </button>
            </div>
        </div>
        <div class="flex justify-between w-full mt-3 px-2 text-xs text-slate-400 font-bold">
            <span>Score: <span id="scoreDisplay" class="text-slate-100">0</span></span>
            <span>High Score: <span id="highScoreDisplay" class="text-yellow-400">{{ high_score|default:0 }}</span></span>
        </div>
    </div>

    <div class="text-xs text-slate-500 text-center">
        Family Chore Arcade • Geometry Dash Style
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('gameOverlay');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const highScoreDisplay = document.getElementById('highScoreDisplay');

        canvas.width = 800;
        canvas.height = 400;

        let gameRunning = false;
        let score = 0;
        let highScore = {{ high_score|default:0 }};
        let lastTime = 0;

        let player = {
            x: 80,
            y: 280,
            width: 36,
            height: 36,
            vy: 0,
            gravity: 0.85,
            jumpPower: -13.5,
            isJumping: false,
            rotation: 0
        };

        let obstacles = [];
        let gameSpeed = 5;
        let spawnTimer = 0;

        function jump() {
            if (!gameRunning) return;
            if (!player.isJumping) {
                player.vy = player.jumpPower;
                player.isJumping = true;
                
                if (typeof playSound === 'function') {
                    playSound('correct');
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                jump();
            }
        });
        canvas.addEventListener('click', () => jump());
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });

        function startGame() {
            overlay.classList.add('hidden');
            obstacles = [];
            score = 0;
            gameSpeed = 5;
            spawnTimer = 0;
            player.y = 280;
            player.vy = 0;
            player.isJumping = false;
            player.rotation = 0;
            lastTime = performance.now();
            gameRunning = true;
            requestAnimationFrame(updateGame);
        }

        function gameOver() {
            gameRunning = false;
            
            if (typeof playSound === 'function') {
                playSound('incorrect');
            }

            fetch("{% url 'submit_arcade_score' profile.id %}", {
                method: 'POST',
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    game_key: 'star_dash',
                    game_title: 'Star Dash',
                    score: score,
                    is_lower_better: false
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    highScore = data.high_score;
                    highScoreDisplay.innerText = highScore;

                    if (data.new_balance !== undefined) {
                        const coinBadge = document.querySelector('span.bg-yellow-500\\/20');
                        if (coinBadge) {
                            coinBadge.innerText = `🪙 ${data.new_balance} Coins`;
                        }
                    }

                    let titleText = "Game Over! 🎮";
                    if (data.earned_bonus) {
                        titleText = "New High Score! +1 🪙 🎉";
                    }
                    overlay.querySelector('h1').innerText = titleText;
                }
            });

            overlay.querySelector('button').innerText = "Play Again 🔄";
            overlay.classList.remove('hidden');
        }
        
        function updateGame(currentTime) {
            if (!gameRunning) return;

            const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
            lastTime = currentTime;
            const fpsScale = dt * 60;

            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Ground Line
            ctx.strokeStyle = '#6366f1';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, 320);
            ctx.lineTo(canvas.width, 320);
            ctx.stroke();

            // Apply Gravity & Update Position
            player.vy += player.gravity * fpsScale;
            player.y += player.vy * fpsScale;

            let groundLevel = 280; 
            if (player.y >= groundLevel) {
                player.y = groundLevel;
                player.vy = 0;
                player.isJumping = false;
                player.rotation = 0; // Snap upright on ground
            } else {
                // Spin/flip while airborne
                player.rotation += 0.12 * fpsScale;
            }

            // Spawn obstacles (Max platform height is 230, keeping it fully reachable from the 280 ground level)
            spawnTimer += fpsScale;
            if (spawnTimer > Math.max(55, 120 - Math.floor(score / 8))) {
                let pattern = Math.floor(Math.random() * 4);

                if (pattern === 0) {
                    // Spike with a low reachable platform above it
                    obstacles.push({
                        x: canvas.width,
                        y: 290,
                        width: 35,
                        height: 30,
                        type: 'spike'
                    });
                    obstacles.push({
                        x: canvas.width,
                        y: 225,
                        width: 140,
                        height: 20,
                        type: 'platform'
                    });
                } else if (pattern === 1) {
                    // Split Path (Low ground spike vs Reachable bridge platform at y: 220)
                    obstacles.push({
                        x: canvas.width,
                        y: 290,
                        width: 70,
                        height: 30,
                        type: 'spike'
                    });
                    obstacles.push({
                        x: canvas.width,
                        y: 220,
                        width: 180,
                        height: 20,
                        type: 'platform'
                    });
                } else if (pattern === 2) {
                    // Stepping stones over a floor spike (all within safe jump height)
                    obstacles.push({
                        x: canvas.width + 20,
                        y: 290,
                        width: 50,
                        height: 30,
                        type: 'spike'
                    });
                    obstacles.push({
                        x: canvas.width,
                        y: 235,
                        width: 60,
                        height: 18,
                        type: 'platform'
                    });
                    obstacles.push({
                        x: canvas.width + 100,
                        y: 215,
                        width: 60,
                        height: 18,
                        type: 'platform'
                    });
                } else {
                    // Extended mid-height bridge platform
                    obstacles.push({
                        x: canvas.width,
                        y: 220,
                        width: 220,
                        height: 20,
                        type: 'platform'
                    });
                    obstacles.push({
                        x: canvas.width + 60,
                        y: 290,
                        width: 90,
                        height: 30,
                        type: 'spike'
                    });
                }
                spawnTimer = 0;
            }

            // Update & Check Collisions with Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed * fpsScale;

                if (obs.type === 'spike') {
                    // Draw Spike
                    ctx.fillStyle = '#f43f5e';
                    ctx.beginPath();
                    ctx.moveTo(obs.x, 320);
                    ctx.lineTo(obs.x + obs.width / 2, 320 - obs.height);
                    ctx.lineTo(obs.x + obs.width, 320);
                    ctx.closePath();
                    ctx.fill();

                    // Spike Collision Hitbox
                    if (
                        player.x + player.width - 6 > obs.x &&
                        player.x + 6 < obs.x + obs.width &&
                        player.y + player.height > 320 - obs.height
                    ) {
                        gameOver();
                        return;
                    }
                } else {
                    // Draw Platform
                    ctx.fillStyle = '#0ea5e9';
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    ctx.strokeStyle = '#38bdf8';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);

                    // Platform Top-Landing Collision Check
                    let prevPlayerY = player.y - (player.vy * fpsScale);
                    if (
                        player.x + player.width - 8 > obs.x &&
                        player.x + 8 < obs.x + obs.width &&
                        prevPlayerY + player.height <= obs.y + 8 &&
                        player.y + player.height >= obs.y &&
                        player.vy >= 0
                    ) {
                        player.y = obs.y - player.height;
                        player.vy = 0;
                        player.isJumping = false;
                        player.rotation = 0; // Snap upright when landing
                    } 
                    // Side collision check
                    else if (
                        player.x + player.width > obs.x + 4 &&
                        player.x < obs.x + obs.width - 4 &&
                        player.y + player.height > obs.y + 4 &&
                        player.y < obs.y + obs.height
                    ) {
                        gameOver();
                        return;
                    }
                }

                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                    score += 10;
                    gameSpeed += 0.04;
                }
            }

            // Draw Flipping Player Cube
            ctx.save();
            ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
            ctx.rotate(player.rotation);
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(4, -10, 6, 6); // Eye
            ctx.restore();

            scoreDisplay.innerText = score;
            requestAnimationFrame(updateGame);
        }
    </script>
</body>
</html>
