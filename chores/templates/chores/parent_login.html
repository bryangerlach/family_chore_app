<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Parent PIN Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 h-screen flex flex-col justify-center items-center text-slate-100">
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl shadow-xl p-8 text-center">
        <h2 class="text-3xl font-bold mb-2 text-amber-400">🔒 Parent Access</h2>
        <p class="text-slate-400 mb-6 text-sm">Enter the parent PIN to access the dashboard.</p>
        
        {% if error %}
            <div class="bg-red-900/50 border border-red-500 text-red-200 text-sm p-3 rounded-lg mb-4">
                {{ error }}
            </div>
        {% endif %}

        <form action="{% url 'parent_login' %}" method="POST" class="space-y-4">
            {% csrf_token %}
            <input type="password" name="pin" placeholder="Enter PIN (Default: 1234)" maxlength="4" autofocus required class="w-full text-center tracking-widest text-2xl bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500">
            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl shadow transition text-lg">
                Unlock Dashboard
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-700">
            <a href="{% url 'profile_list' %}" class="text-sm font-medium text-slate-400 hover:text-slate-200">
                ← Back to Kids Profiles
            </a>
        </div>
    </div>
</body>
</html>
