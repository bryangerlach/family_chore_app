<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Family Chores - Who is using this?</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<link rel="manifest" href="/manifest.json">
<body class="bg-slate-900 h-screen flex flex-col justify-center items-center text-slate-100">
    <div class="max-w-lg w-full bg-slate-800 border border-slate-700 rounded-3xl shadow-2xl p-10 text-center">
        <h1 class="text-3xl font-bold mb-2 text-slate-100">My Daily Helpers</h1>
        <p class="text-slate-400 mb-8 text-sm">Select your profile to get started:</p>
        
        <!-- Grid layout for big square profile cards -->
        <div class="grid grid-cols-2 gap-6 justify-center mb-10">
            {% for profile in profiles %}
                {% if profile.user_type == 'child' %}
                    <a href="{% url 'child_dashboard' profile.id %}" class="aspect-square bg-slate-700/60 hover:bg-blue-600/30 border-2 border-slate-600 hover:border-blue-500 rounded-2xl flex flex-col items-center justify-center p-6 shadow-lg transition-all transform hover:-translate-y-1 active:scale-95 group">
                        <span class="text-5xl mb-3 group-hover:scale-110 transition-transform">{{ profile.emoji }}</span> <!-- Uses dynamic profile emoji -->
                        <span class="text-xl font-bold text-slate-200 group-hover:text-white">{{ profile.name }}</span>
                    </a>
                {% endif %}
            {% endfor %}
        </div>

        <div class="pt-6 border-t border-slate-700">
            <a href="{% url 'parent_dashboard' %}" class="inline-block text-sm font-medium text-slate-400 hover:text-amber-400 transition">
                🔒 Parent / Admin Dashboard
            </a>
        </div>
    </div>
</body>
</html>
