{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade - Memory Match</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{% static 'chores/js/sound_effects.js' %}"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">
    <div class="w-full max-w-2xl flex justify-between items-center bg-slate-800/80 border border-slate-700/60 p-4 rounded-2xl shadow-lg">
        <a href="{% url 'arcade_hub' profile.id %}" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-xl text-sm font-bold transition flex items-center gap-2"><span>←</span> Back to Arcade</a>
        <div class="flex items-center gap-4">
            <span class="bg-yellow-500/20 border border-yellow-500/40 text-yellow-300 px-3 py-1.5 rounded-xl font-bold text-sm">🪙 {{ coin_balance }} Coins</span>
            <span class="font-bold text-cyan-400">🧠 Memory Match</span>
        </div>
    </div>
    <div class="flex flex-col items-center my-auto w-full max-w-2xl">
        <div class="relative bg-slate-950 border-2 border-cyan-500/40 rounded-2xl overflow-hidden shadow-2xl w-full aspect-[2/1] flex flex-col items-center justify-center p-4">
            <div id="gridBox" class="grid gap-2 w-full max-w-md"></div>
            
            <!-- Game Overlay / Level Selector -->
            <div id="gameOverlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-20">
                <h1 class="text-3xl font-extrabold text-cyan-400 mb-2">🧠 Memory Match 🧠</h1>
                <p class="text-slate-300 text-sm mb-4 max-w-xs">Choose your level to find matching pairs in the fewest moves!</p>
                <div class="flex gap-4">
                    <button onclick="startGame(1)" class="bg-cyan-600 hover:bg-cyan-500 text-white font-extrabold px-6 py-3 rounded-2xl shadow-lg transition transform hover:scale-105 text-sm">Level 1 (6 Pairs) ⭐</button>
                    <button onclick="startGame(2)" class="bg-purple-600 hover:bg-purple-500 text-white font-extrabold px-6 py-3 rounded-2xl shadow-lg transition transform hover:scale-105 text-sm">Level 2 (10 Pairs) 🚀</button>
                </div>
            </div>
        </div>
        <div class="flex justify-between w-full mt-3 px-2 text-xs text-slate-400 font-bold">
            <span>Moves: <span id="movesDisplay" class="text-slate-100">0</span></span>
            <span>Best Moves (Lvl <span id="activeLevelDisplay">1</span>): <span id="bestMovesDisplay" class="text-yellow-400">---</span></span>
            <span>Pairs Found: <span id="pairsDisplay" class="text-cyan-400">0 / 6</span></span>
        </div>
    </div>
    <div class="text-xs text-slate-500 text-center">Family Chore Arcade • Train Your Brain!</div>
    <script>
        const overlay = document.getElementById('gameOverlay');
        const movesDisplay = document.getElementById('movesDisplay');
        const pairsDisplay = document.getElementById('pairsDisplay');
        const bestMovesDisplay = document.getElementById('bestMovesDisplay');
        const activeLevelDisplay = document.getElementById('activeLevelDisplay');
        const gridBox = document.getElementById('gridBox');
        
        const level1Icons = ['⭐', '🪙', '🚀', '🍎', '🐱', '⚽'];
        const level2Icons = ['⭐', '🪙', '🚀', '🍎', '🐱', '⚽', '🎨', '🎸', '🍕', '🚗'];
        
        let currentLevel = 1;
        let cards = [], flipped = [], matchedPairs = 0, moves = 0, lockBoard = false;
        
        // High scores passed from backend view
        const bestLvl1 = {{ high_score_1|default:999 }};
        const bestLvl2 = {{ high_score_2|default:999 }};

        function updateBestDisplay() {
            activeLevelDisplay.innerText = currentLevel;
            let currentBest = (currentLevel === 2) ? bestLvl2 : bestLvl1;
            bestMovesDisplay.innerText = (currentBest < 999) ? currentBest : '---';
        }

        function startGame(level) {
            currentLevel = level;
            updateBestDisplay();
            overlay.classList.add('hidden');
            moves = 0; matchedPairs = 0; flipped = [];
            movesDisplay.innerText = moves;
            
            let icons = (currentLevel === 2) ? level2Icons : level1Icons;
            pairsDisplay.innerText = `0 / ${icons.length}`;
            
            if (currentLevel === 2) {
                gridBox.className = "grid grid-cols-5 gap-2 w-full max-w-lg";
            } else {
                gridBox.className = "grid grid-cols-4 gap-2 w-full max-w-md";
            }

            cards = [...icons, ...icons].sort(() => Math.random() - 0.5);
            gridBox.innerHTML = '';
            cards.forEach((icon, index) => {
                let card = document.createElement('div');
                let heightClass = (currentLevel === 2) ? 'h-12 text-xl' : 'h-16 text-2xl';
                card.className = `bg-slate-800 border border-slate-700 ${heightClass} rounded-xl flex items-center justify-center cursor-pointer transition transform hover:scale-105`;
                card.dataset.icon = icon;
                card.dataset.index = index;
                card.innerText = '❓';
                card.onclick = () => flipCard(card, icon, index);
                gridBox.appendChild(card);
            });
        }

        function flipCard(card, icon, index) {
            let icons = (currentLevel === 2) ? level2Icons : level1Icons;
            let totalPairs = icons.length;

            if (lockBoard || card.classList.contains('matched') || flipped.includes(index)) return;
            card.innerText = icon;
            card.classList.add('bg-slate-700', 'border-cyan-500');
            flipped.push({ index, icon, card });
            if (flipped.length === 2) {
                moves++;
                movesDisplay.innerText = moves;
                lockBoard = true;
                if (flipped[0].icon === flipped[1].icon) {
                    matchedPairs++;
                    pairsDisplay.innerText = `${matchedPairs} / ${totalPairs}`;
                    if (typeof playSound === 'function') playSound('correct');
                    flipped = [];
                    lockBoard = false;
                    if (matchedPairs === totalPairs) endGame();
                } else {
                    if (typeof playSound === 'function') playSound('incorrect');
                    setTimeout(() => {
                        let hClass = (currentLevel === 2) ? 'h-12 text-xl' : 'h-16 text-2xl';
                        flipped[0].card.innerText = '❓';
                        flipped[0].card.className = `bg-slate-800 border border-slate-700 ${hClass} rounded-xl flex items-center justify-center cursor-pointer transition transform hover:scale-105`;
                        flipped[1].card.innerText = '❓';
                        flipped[1].card.className = `bg-slate-800 border border-slate-700 ${hClass} rounded-xl flex items-center justify-center cursor-pointer transition transform hover:scale-105`;
                        flipped = [];
                        lockBoard = false;
                    }, 900);
                }
            }
        }

        function endGame() {
            let gameKey = (currentLevel === 2) ? 'memory_match_2' : 'memory_match_1';
            let gameTitle = (currentLevel === 2) ? 'Memory Match (Lvl 2)' : 'Memory Match (Lvl 1)';

            // Submit score to database via AJAX
            fetch("{% url 'submit_arcade_score' profile.id %}", {
                method: 'POST',
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    game_key: gameKey,
                    game_title: gameTitle,
                    score: moves,
                    is_lower_better: true
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    if (currentLevel === 2) {
                        bestLvl2 = data.high_score;
                    } else {
                        bestLvl1 = data.high_score;
                    }
                    updateBestDisplay();

                    if (data.new_balance !== undefined) {
                        const coinBadge = document.querySelector('span.bg-yellow-500\\/20');
                        if (coinBadge) coinBadge.innerText = `🪙 ${data.new_balance} Coins`;
                    }

                    if (data.earned_bonus) {
                        overlay.querySelector('h1').innerText = "New Best Score! +1 🪙 🎉";
                    } else {
                        overlay.querySelector('h1').innerText = "Puzzle Completed! 🧠";
                    }
                }
            });

            overlay.querySelector('p').innerText = `You finished Level ${currentLevel} in ${moves} moves!`;
            overlay.querySelector('.flex.gap-4').innerHTML = `
                <button onclick="startGame(1)" class="bg-cyan-600 hover:bg-cyan-500 text-white font-extrabold px-5 py-2.5 rounded-xl text-xs shadow">Level 1 🌟</button>
                <button onclick="startGame(2)" class="bg-purple-600 hover:bg-purple-500 text-white font-extrabold px-5 py-2.5 rounded-xl text-xs shadow">Level 2 🚀</button>
            `;
            overlay.classList.remove('hidden');
        }

        // Initialize display on load
        updateBestDisplay();
    </script>
</body>
</html>
