{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade - Memory Match</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{% static 'chores/js/sound_effects.js' %}"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">
    <div class="w-full max-w-2xl flex justify-between items-center bg-slate-800/80 border border-slate-700/60 p-4 rounded-2xl shadow-lg">
        <a href="{% url 'arcade_hub' profile.id %}" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-xl text-sm font-bold transition flex items-center gap-2"><span>←</span> Back to Arcade</a>
        <div class="flex items-center gap-4">
            <span class="bg-yellow-500/20 border border-yellow-500/40 text-yellow-300 px-3 py-1.5 rounded-xl font-bold text-sm">🪙 {{ coin_balance }} Coins</span>
            <span class="font-bold text-cyan-400">🧠 Memory Match</span>
        </div>
    </div>
    <div class="flex flex-col items-center my-auto w-full max-w-2xl">
        <div class="relative bg-slate-950 border-2 border-cyan-500/40 rounded-2xl overflow-hidden shadow-2xl w-full aspect-[2/1] flex flex-col items-center justify-center p-4">
            <div id="gridBox" class="grid grid-cols-4 gap-3 w-full max-w-md"></div>
            <div id="gameOverlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center">
                <h1 class="text-3xl font-extrabold text-cyan-400 mb-2">🧠 Memory Match 🧠</h1>
                <p class="text-slate-300 text-sm mb-6 max-w-xs">Flip cards to find matching pairs of icons in the fewest moves!</p>
                <button onclick="startGame()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-extrabold px-8 py-3 rounded-2xl shadow-lg transition transform hover:scale-105">Start Game 🚀</button>
            </div>
        </div>
        <div class="flex justify-between w-full mt-3 px-2 text-xs text-slate-400 font-bold">
            <span>Moves: <span id="movesDisplay" class="text-slate-100">0</span></span>
            <span>Pairs Found: <span id="pairsDisplay" class="text-cyan-400">0 / 6</span></span>
        </div>
    </div>
    <div class="text-xs text-slate-500 text-center">Family Chore Arcade • Train Your Brain!</div>
    <script>
        const overlay = document.getElementById('gameOverlay');
        const movesDisplay = document.getElementById('movesDisplay');
        const pairsDisplay = document.getElementById('pairsDisplay');
        const gridBox = document.getElementById('gridBox');
        const icons = ['⭐', '🪙', '🚀', '🍎', '🐱', '⚽'];
        let cards = [], flipped = [], matchedPairs = 0, moves = 0, lockBoard = false;

        function startGame() {
            overlay.classList.add('hidden');
            moves = 0; matchedPairs = 0; flipped = [];
            movesDisplay.innerText = moves; pairsDisplay.innerText = `0 / 6`;
            cards = [...icons, ...icons].sort(() => Math.random() - 0.5);
            gridBox.innerHTML = '';
            cards.forEach((icon, index) => {
                let card = document.createElement('div');
                card.className = 'bg-slate-800 border border-slate-700 h-16 rounded-xl flex items-center justify-center text-2xl cursor-pointer transition transform hover:scale-105';
                card.dataset.icon = icon;
                card.dataset.index = index;
                card.innerText = '❓';
                card.onclick = () => flipCard(card, icon, index);
                gridBox.appendChild(card);
            });
        }

        function flipCard(card, icon, index) {
            if (lockBoard || card.classList.contains('matched') || flipped.includes(index)) return;
            card.innerText = icon;
            card.classList.add('bg-slate-700', 'border-cyan-500');
            flipped.push({ index, icon, card });
            if (flipped.length === 2) {
                moves++;
                movesDisplay.innerText = moves;
                lockBoard = true;
                if (flipped[0].icon === flipped[1].icon) {
                    matchedPairs++;
                    pairsDisplay.innerText = `${matchedPairs} / 6`;
                    if (typeof playSound === 'function') playSound('correct');
                    flipped = [];
                    lockBoard = false;
                    if (matchedPairs === 6) endGame();
                } else {
                    if (typeof playSound === 'function') playSound('incorrect');
                    setTimeout(() => {
                        flipped[0].card.innerText = '❓';
                        flipped[0].card.className = 'bg-slate-800 border border-slate-700 h-16 rounded-xl flex items-center justify-center text-2xl cursor-pointer transition transform hover:scale-105';
                        flipped[1].card.innerText = '❓';
                        flipped[1].card.className = 'bg-slate-800 border border-slate-700 h-16 rounded-xl flex items-center justify-center text-2xl cursor-pointer transition transform hover:scale-105';
                        flipped = [];
                        lockBoard = false;
                    }, 900);
                }
            }
        }

        function endGame() {
            let bestMoves = localStorage.getItem('memory_best') || 999;
            let earnedBonus = false;
            if (moves < bestMoves) {
                localStorage.setItem('memory_best', moves);
                earnedBonus = true;
                fetch("{% url 'claim_arcade_bonus' profile.id %}", {
                    method: 'POST',
                    headers: { 'X-CSRFToken': '{{ csrf_token }}', 'Content-Type': 'application/json' }
                }).then(res => res.json()).then(data => {
                    if (data.status === 'success') {
                        const badge = document.querySelector('span.bg-yellow-500\\/20');
                        if (badge) badge.innerText = `🪙 ${data.new_balance} Coins`;
                    }
                });
            }
            overlay.querySelector('h1').innerText = earnedBonus ? "New Best Score! +1 🪙 🎉" : "Puzzle Completed! 🧠";
            overlay.querySelector('button').innerText = "Play Again 🔄";
            overlay.classList.remove('hidden');
        }
    </script>
</body>
</html>
