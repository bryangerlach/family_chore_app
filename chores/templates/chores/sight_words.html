{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sight Words - {{ profile.name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-6">
    
    <!-- Header -->
    <div class="w-full max-w-2xl flex justify-between items-center bg-slate-800/80 border border-slate-700/60 p-4 rounded-2xl shadow-lg mb-8">
        <a href="{% url 'child_dashboard' profile.id %}" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-xl text-sm font-bold transition">
            ← Dashboard
        </a>
        <span class="font-bold text-cyan-400 text-lg">📚 Sight Words</span>
    </div>

    <!-- Flashcard Arena -->
    <div class="w-full max-w-xl flex flex-col items-center">
        
        <!-- Word count & empty state logic inside sight_words.html -->
        <div id="flashcard" class="w-full bg-slate-800 border-4 border-cyan-500/50 rounded-3xl p-16 shadow-2xl flex items-center justify-center min-h-[300px] mb-8 relative">
            <button onclick="readWord()" id="speakerBtn" class="absolute top-4 right-4 bg-slate-700 hover:bg-slate-600 p-3 rounded-full shadow-lg transition transform hover:scale-110 {% if total_words_count == 0 %}hidden{% endif %}" title="Read aloud">
                🔊
            </button>
            <h1 id="wordDisplay" class="text-6xl md:text-8xl font-extrabold text-white tracking-wide text-center">
                {% if total_words_count == 0 %}No Words Yet!{% else %}Ready?{% endif %}
            </h1>
        </div>

        <div class="flex gap-4 w-full">
            <button onclick="nextWord()" id="nextBtn" {% if total_words_count == 0 %}disabled{% endif %} class="flex-1 bg-cyan-600 hover:bg-cyan-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-extrabold py-5 rounded-2xl shadow-lg text-2xl transition transform hover:scale-105 active:scale-95">
                Next Word ➡️
            </button>
        </div>
        
        <p class="text-slate-400 mt-6 text-sm font-bold">Words Practiced: <span id="counter" class="text-cyan-400">0</span></p>
    </div>

    <script>
        const words = JSON.parse('{{ words_json|safe }}');
        const wordDisplay = document.getElementById('wordDisplay');
        const counterDisplay = document.getElementById('counter');
        let currentWord = "Ready?";
        let practiceCount = 0;

        // Shuffle array using Fisher-Yates algorithm
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        let wordQueue = [];

        function nextWord() {
            if (words.length === 0) {
                wordDisplay.innerText = "No words found!";
                return;
            }

            // Reshuffle if we run out of words
            if (wordQueue.length === 0) {
                wordQueue = shuffle([...words]);
            }

            currentWord = wordQueue.pop();
            wordDisplay.innerText = currentWord;
            
            if (practiceCount > 0) {
                counterDisplay.innerText = practiceCount;
            }
            practiceCount++;
        }

        function readWord() {
            if (currentWord === "Ready?" || currentWord === "No words found!") return;
            
            const utterance = new SpeechSynthesisUtterance(currentWord);
            utterance.rate = 0.85; // Slightly slower for kids
            utterance.pitch = 1.1; // Slightly higher/friendlier pitch
            
            // Optional: Force English language
            utterance.lang = 'en-US';
            
            window.speechSynthesis.speak(utterance);
        }

        // Start immediately
        if (words.length > 0) {
            nextWord();
        }
    </script>
</body>
</html>
