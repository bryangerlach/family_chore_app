<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task - {{ task.title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-8 flex items-center justify-center">
    <div class="max-w-xl w-full bg-slate-800 border border-slate-700 rounded-3xl p-6 sm:p-8 shadow-2xl">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-emerald-400">✏️ Edit Chore / Task</h1>
            <a href="{% url 'parent_dashboard' %}" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-xs font-bold text-slate-300 transition">Cancel</a>
        </div>

        <form action="{% url 'edit_task' task.id %}" method="POST" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" name="title" value="{{ task.title }}" placeholder="Task Title" required class="bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-white flex-grow focus:outline-none focus:border-emerald-500 text-sm">
                <input type="number" name="star_value" value="{{ task.star_value }}" min="1" placeholder="Stars" required class="w-28 bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-emerald-500">
            </div>
            
            <input type="text" name="description" value="{{ task.description|default:'' }}" placeholder="Description/Rule (optional)" class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-emerald-500">

            <!-- Days of the week checkboxes -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2">Available Days of the Week:</label>
                <div class="flex flex-wrap gap-2">
                    <label class="bg-slate-700/80 border border-slate-600 px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5 cursor-pointer text-slate-200">
                        <input type="checkbox" name="allowed_days" value="0" {% if "0" in task.allowed_days %}checked{% endif %} class="rounded bg-slate-600 border-slate-500 text-emerald-500 focus:ring-0"> Sun
                    </label>
                    <label class="bg-slate-700/80 border border-slate-600 px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5 cursor-pointer text-slate-200">
                        <input type="checkbox" name="allowed_days" value="1" {% if "1" in task.allowed_days %}checked{% endif %} class="rounded bg-slate-600 border-slate-500 text-emerald-500 focus:ring-0"> Mon
                    </label>
                    <label class="bg-slate-700/80 border border-slate-600 px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5 cursor-pointer text-slate-200">
                        <input type="checkbox" name="allowed_days" value="2" {% if "2" in task.allowed_days %}checked{% endif %} class="rounded bg-slate-600 border-slate-500 text-emerald-500 focus:ring-0"> Tue
                    </label>
                    <label class="bg-slate-700/80 border border-slate-600 px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5 cursor-pointer text-slate-200">
                        <input type="checkbox" name="allowed_days" value="3" {% if "3" in task.allowed_days %}checked{% endif %} class="rounded bg-slate-600 border-slate-500 text-emerald-500 focus:ring-0"> Wed
                    </label>
                    <label class="bg-slate-700/80 border border-slate-600 px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5 cursor-pointer text-slate-200">
                        <input type="checkbox" name="allowed_days" value="4" {% if "4" in task.allowed_days %}checked{% endif %} class="rounded bg-slate-600 border-slate-500 text-emerald-500 focus:ring-0"> Thu
                    </label>
                    <label class="bg-slate-700/80 border border-slate-600 px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5 cursor-pointer text-slate-200">
                        <input type="checkbox" name="allowed_days" value="5" {% if "5" in task.allowed_days %}checked{% endif %} class="rounded bg-slate-600 border-slate-500 text-emerald-500 focus:ring-0"> Fri
                    </label>
                    <label class="bg-slate-700/80 border border-slate-600 px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5 cursor-pointer text-slate-200">
                        <input type="checkbox" name="allowed_days" value="6" {% if "6" in task.allowed_days %}checked{% endif %} class="rounded bg-slate-600 border-slate-500 text-emerald-500 focus:ring-0"> Sat
                    </label>
                </div>
            </div>

            <!-- Current Image & Replacement -->
            <div class="mb-4">
                <label class="block text-sm font-bold text-slate-300 mb-2">Task Reference Image</label>
                
                {% if task.image %}
                    <div class="flex items-center gap-4 mb-3 bg-slate-700/50 p-3 rounded-2xl border border-slate-600">
                        <img src="{{ task.image.url }}" alt="{{ task.title }}" class="w-16 h-16 object-cover rounded-xl border border-slate-500">
                        <div class="flex flex-col">
                            <span class="text-xs text-slate-300 font-medium">Current Image</span>
                            <label class="inline-flex items-center gap-2 mt-1 cursor-pointer">
                                <input type="checkbox" name="clear_image" class="rounded bg-slate-700 border-slate-600 text-red-500 focus:ring-0">
                                <span class="text-xs text-red-400 font-bold">Remove this image</span>
                            </label>
                        </div>
                    </div>
                {% endif %}

                <input type="file" name="image" class="w-full bg-slate-700 border border-slate-600 rounded-xl px-3 py-2 text-white text-sm">
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold py-3.5 rounded-xl text-sm shadow-lg transition">
                    Save Changes 💾
                </button>
            </div>
        </form>
    </div>
</body>
</html>
