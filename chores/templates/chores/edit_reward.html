<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Reward - {{ reward.title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-8 flex items-center justify-center">
    <div class="max-w-xl w-full bg-slate-800 border border-slate-700 rounded-3xl p-6 sm:p-8 shadow-2xl">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-amber-400">✏️ Edit Reward</h1>
            <a href="{% url 'parent_dashboard' %}" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-xs font-bold text-slate-300 transition">Cancel</a>
        </div>

        <form action="{% url 'edit_reward' reward.id %}" method="POST" class="space-y-4">
            {% csrf_token %}
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" name="title" value="{{ reward.title }}" placeholder="Reward Title" required class="bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-white flex-grow focus:outline-none focus:border-amber-500 text-sm">
                <input type="number" name="star_cost" value="{{ reward.star_cost }}" min="0" placeholder="Star Cost" required class="w-28 bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-500">
            </div>
            
            <input type="text" name="description" value="{{ reward.description|default:'' }}" placeholder="Description/Rules (optional)" class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-500">

            <!-- Reward Type Dropdown -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Reward Availability Type:</label>
                <select name="reward_type" class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-500">
                    <option value="recurring" {% if reward.reward_type == 'recurring' %}selected{% endif %}>🔄 Recurring (Can be claimed unlimited times)</option>
                    <option value="weekly" {% if reward.reward_type == 'weekly' %}selected{% endif %}>📅 Once Per Week (Resets every Sunday)</option>
                    <option value="one_time" {% if reward.reward_type == 'one_time' %}selected{% endif %}>🔒 One-Time Only (Never again once claimed)</option>
                </select>
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 active:scale-95 text-white font-bold py-3.5 rounded-xl text-sm shadow-lg transition">
                    Save Changes 💾
                </button>
            </div>
        </form>
    </div>
</body>
</html>
